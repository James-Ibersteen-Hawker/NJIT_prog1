<!DOCTYPE html>
<html lang="en">
  <head>
    <title>NJIT Project 1</title>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Black+Ops+One&display=swap"
      rel="stylesheet"
    />
  </head>

  <body class="container-fluid">
    <header>Tanks from History, by Remy Serbinenko</header>
    <main class="row">
      <div class="col-12 col-md-10 col-lg-8 col-xxl-10">
        <div class="back">
          <div class="front">
            <div class="shadow">
              <div class="content">
                <div class="contentContainer">
                  <div class="img">
                    <div class="lArrow arrow">
                      <div class="arrowInner arrowInL"></div>
                    </div>
                    <div class="rArrow arrow">
                      <div class="arrowInner arrowInR"></div>
                    </div>
                  </div>
                  <div class="description">
                    <div class="moreBtn">
                      <img src="imgs/arrow.png" class="img-fluid" />
                    </div>
                    <div class="more">
                      <div class="name"></div>
                      <div class="blurb"></div>
                    </div>
                  </div>
                </div>
              </div>
              <div class="screen"></div>
            </div>
          </div>
        </div>
      </div>
    </main>
    <!--defs-->
    <svg
      xmlns="http://www.w3.org/2000/svg"
      width="500"
      height="300"
      aria-hidden="true"
      viewBox="0 0 500 300"
    >
      <defs>
        <clipPath id="screenClip" clipPathUnits="objectBoundingBox">
          <path
            d="M 0.07,0.1
       A 1 0.3 0 0 1 0.93,0.1
       A 0.1 0.7 0 0 1 0.93,0.9
       A 1 0.3 0 0 1 0.07,0.9
       A 0.1 0.7 0 0 1 0.07,0.1 Z"
          />
        </clipPath>
        <clipPath id="lArrowClip" clipPathUnits="objectBoundingBox">
          <path d="M 0.8,0 L 0.3,0.5 L 0.8,1 A 0.5 1 0 0 1,0.8,0 Z"></path>
        </clipPath>
        <clipPath id="rArrowClip" clipPathUnits="objectBoundingBox">
          <path d="M 0.2,0 L 0.7,0.5 L 0.2,1 A 0.5 1 0 0 0 0.2,0 Z"></path>
        </clipPath>
      </defs>
    </svg>
    <!--defs-->
    <script
      src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
      integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://code.jquery.com/jquery-3.7.1.min.js"
      integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.min.js"
      integrity="sha384-BBtl+eGJRgqQAUMxJ7pMwbEyER4l1g+O15P+16Ep7Q9Q+zqX6gSbd85u4mG4QzX+"
      crossorigin="anonymous"
    ></script>
    <script src="script.js"></script>
  </body>
</html>
